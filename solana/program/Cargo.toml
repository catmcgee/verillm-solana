[package]
name = "verillm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
solana-curve25519 = "2.3"
solana-program = "2.3"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow" }
